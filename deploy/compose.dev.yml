# deploy/compose.dev.yml — the local stack (wasi-server-plan §15).
#
# Wasi + strip + maddy (the local IMAP/SMTP fixture), runnable with zero
# hardware and no Fastmail account. `make up` / `make down` drive this file;
# `make e2e` additionally runs `go test -tags e2e ./test/e2e/...` against it.
#
# See deploy/README.md for: what maddy diverges from Fastmail on, how to
# inject a message directly into a folder (needed for V-16, since this
# fixture never actually classifies anything as spam), and the exact
# host-side ports below.
#
# Everything here binds to 127.0.0.1 only — this is a dev fixture, not
# something meant to be reachable from outside the machine it runs on.

services:
  # --- maddy: the local IMAP/SMTP fixture --------------------------------

  maddy-certs:
    image: alpine:3.20
    volumes:
      - maddy_tls:/tls
      - ./maddy/gen-certs.sh:/gen-certs.sh:ro
    environment:
      MADDY_HOSTNAME: mail.chaski.test
    entrypoint: ["sh", "/gen-certs.sh", "/tls"]

  maddy-init:
    image: foxcpp/maddy:0.7
    depends_on:
      maddy-certs:
        condition: service_completed_successfully
    volumes:
      - maddy_data:/data
      - maddy_tls:/data/tls:ro
      - ./maddy/maddy.conf:/data/maddy.conf:ro
      - ./maddy/init.sh:/init.sh:ro
    environment:
      MADDY_HOSTNAME: mail.chaski.test
      MADDY_DOMAIN: chaski.test
      MADDY_TEST_USER: ${MADDY_TEST_USER:-kid@chaski.test}
      MADDY_TEST_PASSWORD: ${MADDY_TEST_PASSWORD:-devpassword123}
    entrypoint: ["sh", "/init.sh"]

  maddy:
    image: foxcpp/maddy:0.7
    depends_on:
      maddy-init:
        condition: service_completed_successfully
    volumes:
      - maddy_data:/data
      - maddy_tls:/data/tls:ro
      - ./maddy/maddy.conf:/data/maddy.conf:ro
    environment:
      MADDY_HOSTNAME: mail.chaski.test
      MADDY_DOMAIN: chaski.test
    ports:
      # host:container — dev convenience only, so a human (or a `go test`
      # run straight from the host, as this package's own integration tests
      # do) can point at the fixture without joining the compose network.
      - "127.0.0.1:1993:993"   # IMAP, implicit TLS — what Mailbox dials
      - "127.0.0.1:1143:143"   # IMAP, plaintext — debugging only
      - "127.0.0.1:1465:465"   # submission, implicit TLS — what Submitter dials
      - "127.0.0.1:1587:587"   # submission, STARTTLS — debugging only
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "993"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- strip: quote-stripping service (§11.1) -----------------------------

  strip:
    build:
      context: ../services/strip
    environment:
      STRIP_BEARER_TOKEN: ${WASI_SERVICE_TOKEN:-dev-shared-service-token}
    ports:
      - "127.0.0.1:18080:8080" # dev convenience only; private network in prod
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- wasi: the server under test -----------------------------------------

  # §12.1: Wasi's two listeners need two certificates before it will start.
  # The device leaf is signed by a local CA so the simulator can pin it and
  # exercise the real §12.2 trust path rather than skipping verification.
  wasi-certs:
    image: alpine:3.20
    volumes:
      - wasi_tls:/config/tls
      - ./wasi/gen-certs.sh:/gen-certs.sh:ro
    entrypoint: ["sh", "/gen-certs.sh", "/config/tls"]

  wasi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      maddy:
        condition: service_healthy
      strip:
        condition: service_healthy
      wasi-certs:
        condition: service_completed_successfully
    # §14: read-only rootfs except /data. The Dockerfile can't declare this
    # itself (it's a runtime flag, not an image property) — this is where
    # it actually gets enforced.
    read_only: true
    volumes:
      - ./wasi.example.toml:/config/wasi.toml:ro
      - wasi_tls:/config/tls:ro
      - maddy_tls:/config/maddy-tls:ro
      - wasi_data:/data
      # §3's backup destination, and the second half of what V-11's storage
      # grep walks. It is mounted even though `wasi backup` is not implemented
      # yet, so that the day it is, the invariant test is already looking at
      # the right place rather than at nothing.
      - wasi_backups:/backups
    environment:
      # Fixture-only: maddy serves a self-signed cert, and Fastmail (which
      # this stands in for) serves a publicly-trusted one. Go reads
      # SSL_CERT_FILE for the system pool, so the fixture's CA is trusted
      # here without Wasi growing a "skip TLS verification" config knob —
      # a knob that would exist in production builds forever to solve a
      # problem that only exists in this file.
      SSL_CERT_FILE: /config/maddy-tls/fullchain.pem
      WASI_IMAP_PASSWORD: ${MADDY_TEST_PASSWORD:-devpassword123}
      WASI_COOKIE_SIGNING_KEY: ${WASI_COOKIE_SIGNING_KEY:-dev-cookie-signing-key-not-for-prod}
      WASI_SERVICE_TOKEN: ${WASI_SERVICE_TOKEN:-dev-shared-service-token}
      # §10.2: the doorbell MAC key is necessarily separate from the device
      # bearer token, since Wasi stores only a hash of that one and cannot MAC
      # with it. Startup fails loudly if a carrier is configured without this,
      # rather than running with a doorbell that silently never rings.
      WASI_PUTUTU_KEY: ${WASI_PUTUTU_KEY:-dev-pututu-hmac-key-not-for-prod}
    ports:
      - "127.0.0.1:18443:8443" # device sync listener (§12.1)
      - "127.0.0.1:18444:8444" # guardian web UI (§12.1)

volumes:
  wasi_tls:
  maddy_data:
  maddy_tls:
  wasi_data:
  wasi_backups:
