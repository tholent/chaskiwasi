## maddy config for the Wasi local dev/e2e fixture (wasi-server-plan §15).
##
## This is maddy's own stock Docker config (foxcpp/maddy:0.7, extracted from
## /data/maddy.conf in the image), unmodified apart from this header. It is
## not tuned for Wasi in any way — Wasi talks to it exactly as it would talk
## to Fastmail, over IMAP and SMTP submission, which is the point: the fixture
## exists so the real client code gets exercised, not a mock of it.
##
## MADDY_HOSTNAME / MADDY_DOMAIN come from the environment (see
## ../compose.dev.yml). TLS certs are expected at /data/tls/{fullchain,
## privkey}.pem — generated by gen-certs.sh before this ever starts. Accounts
## and the Held mailbox are provisioned by init.sh, not by this file: maddy
## has no config-level notion of "users," only credential/storage backends
## that get populated via the `maddy` CLI (see deploy/README.md for how the
## e2e suite injects a message straight into a folder using that same CLI).
##
## See deploy/README.md for what's incidental here (SPF/DKIM/outbound relay
## — none of it is reachable in this fixture, since no test contact address
## ever resolves off this container) versus what V-16 depends on (the Junk
## folder existing so a message can be dropped into it directly, since maddy
## itself never classifies anything as spam).

$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = $(primary_domain)

tls file /data/tls/fullchain.pem /data/tls/privkey.pem

# ----------------------------------------------------------------------------
# Local storage & authentication

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}

# ----------------------------------------------------------------------------
# SMTP endpoints + message routing

hostname $(hostname)

table.chain local_rewrites {
    optional_step regexp "(.+)\+(.+)@(.+)" "$1@$3"
    optional_step static {
        entry postmaster postmaster@$(primary_domain)
    }
    optional_step file /etc/maddy/aliases
}

msgpipeline local_routing {
    destination postmaster $(local_domains) {
        modify {
            replace_rcpt &local_rewrites
        }

        deliver_to &local_mailboxes
    }

    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

smtp tcp://0.0.0.0:25 {
    limits {
        all rate 20 1s
        all concurrency 10
    }

    dmarc yes
    check {
        require_mx_record
        dkim
        spf
    }

    source $(local_domains) {
        reject 501 5.1.8 "Use Submission for outgoing SMTP"
    }
    default_source {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.1.1 "User doesn't exist"
        }
    }
}

# This is the endpoint Wasi's internal/mailbox.Submitter talks to (§5, §11).
submission tls://0.0.0.0:465 tcp://0.0.0.0:587 {
    limits {
        all rate 50 1s
    }

    auth &local_authdb

    source $(local_domains) {
        check {
            authorize_sender {
                prepare_email &local_rewrites
                user_to_email identity
            }
        }

        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            modify {
                dkim $(primary_domain) $(local_domains) default
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender domain"
    }
}

# Not reachable in this fixture: every test contact address is under
# $(primary_domain), so mail never actually leaves via outbound_delivery.
# Left in place because submission's config references &remote_queue.
target.remote outbound_delivery {
    limits {
        destination rate 20 1s
        destination concurrency 10
    }
    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir mtasts_cache/
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}

target.queue remote_queue {
    target &outbound_delivery

    autogenerated_msg_domain $(primary_domain)
    bounce {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.0.0 "Refusing to send DSNs to non-local addresses"
        }
    }
}

# ----------------------------------------------------------------------------
# IMAP endpoints

# This is the endpoint Wasi's internal/mailbox.Mailbox talks to (§5, §8).
imap tls://0.0.0.0:993 tcp://0.0.0.0:143 {
    auth &local_authdb
    storage &local_mailboxes
}
